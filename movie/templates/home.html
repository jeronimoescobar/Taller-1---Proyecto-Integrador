<!DOCTYPE html>
<html>
<head>
    <title>Movie Reviews</title>
</head>

<body>

    <h1>Welcome to Home Page, {{ name }}</h1>
    <h2>This is the full home page</h2>

    <form action="">
        <label for="searchMovie">Search for Movie:</label>
        <input type="text" name="searchMovie">
        <button type="submit">Search</button>
    </form>

    <p>Searching for {{ searchTerm }}</p>

    {% for movie in movies %}

        <h2>{{ movie.title }}</h2>
        <h3>{{ movie.description }}</h3>

        {% if movie.image %}
            <img src="{{ movie.image.url }}" width="300">
        {% endif %}

        {% if movie.url %}
            <p>
                <a href="{{ movie.url }}">Movie Link</a>
            </p>
        {% endif %}

        <br>

    {% endfor %}

</body>
</html>
