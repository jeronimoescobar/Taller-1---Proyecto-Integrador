<!DOCTYPE html>
<html>
<head>
    <title>Movie Reviews</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1>Welcome to Home Page, {{ name }}</h1>
        <h2>This is the full home page</h2>

        <form action="" class="mb-3">
            <label for="searchMovie" class="form-label">Search for Movie:</label>
            <input type="text" class="form-control" name="searchMovie" id="searchMovie">
            <button type="submit" class="btn btn-primary mt-2">Search</button>
        </form>

        <p>Searching for {{ searchTerm }}</p>

        {% for movie in movies %}

            <h2>{{ movie.title }}</h2>
            <h3>{{ movie.description }}</h3>

            {% if movie.image %}
                <img src="{{ movie.image.url }}" width="300" class="img-fluid">
            {% endif %}

            {% if movie.url %}
                <p>
                    <a href="{{ movie.url }}" class="btn btn-secondary mt-2">Movie Link</a>
                </p>
            {% endif %}

            <br>

        {% endfor %}

    </div>

</body>
</html>
